name: API Boundary Check

on:
  pull_request:
    branches: [main, 'feature/**']
  push:
    branches: [main, 'feature/**']

jobs:
  check-boundary:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-api-boundary.sh
        run: ./ci/scripts/check-api-boundary.sh
