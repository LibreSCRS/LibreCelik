# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# preflight -> build-* -> seal -> publish. A tag push publishes. A dispatch,
# and a branch push that changes what the release builds, rehearse: the same
# jobs over the same code, with an ephemeral signing key instead of a keyless
# one, and the release kept as a workflow artefact instead of created. This is
# the only path to the distribution packages, so a change to any of them is
# proved the way the tag will build it. Nothing is built or
# signed before the preflight has judged the tag's signature, the version
# surfaces and the cross-repository pins.
#
# No macOS asset: the macOS release of LibreCelik comes from LibreMac's
# release, one disk image carrying both applications, which packages this
# repository's revision with scripts/macos/build-app.sh.
#
# No AppImage either. LibreCelik reads cards only through the agent, and the
# agent cannot ride in one (a polkit action, a session bus activation file and
# a systemd user unit are system files), so on Linux LibreCelik ships as a
# package beside the agent's, for every distribution the agent is packaged for.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    branches: [main, 'ci/**']
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'packaging/**'
      - 'licenses/**'
      - 'ci/release-assets.txt'
      - 'ci/scripts/check-bundled-licenses.py'
      - 'ci/scripts/gen-third-party-notices.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@164794a2151a30d5772355b7498acc2d73a2f7fa
        with:
          # A tag push publishes; a branch push and a dispatch default to
          # rehearse (a dispatch may ask for publish, refused off a tag).
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          version-min: '1'

  source-tarball:
    # The source tarball is produced by this project, not by GitHub. GitHub's
    # archive/refs/tags tarball omits every submodule tree and its bytes are
    # not ours to assert; this one comes from a clone with --recurse-submodules
    # and is byte-identical run to run. It is published for what it is on its
    # own: the exact sources beside the binaries built from them, signed and
    # listed in SHA256SUMS like every other asset.
    needs: [preflight]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 164794a2151a30d5772355b7498acc2d73a2f7fa
          path: .ci
          persist-credentials: false

      - name: Build the source tarball
        run: |
          set -euo pipefail
          .ci/scripts/make-source-tarball --name librecelik --out "$RUNNER_TEMP/srctar"
          ls -l "$RUNNER_TEMP/srctar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Ends in -artifacts: the seal job collects `*-artifacts`.
          name: source-tarball-artifacts
          path: ${{ runner.temp }}/srctar/*.orig.tar.gz
          if-no-files-found: error
          retention-days: 3

  packages:
    # librecelik as a deb and an rpm for every supported distribution. On a
    # tag the agent client and the middleware come from their own published
    # releases of the same version (the release order publishes them first);
    # a rehearsal builds them from the commits deps.lock closes over instead.
    name: packages (${{ matrix.slug }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: LibreSCRS/ci/actions/pkg-build@164794a2151a30d5772355b7498acc2d73a2f7fa
        id: build
        with:
          slug: ${{ matrix.slug }}
          upstream: ${{ github.ref_type == 'tag' && 'release' || 'source' }}
          version: ${{ github.ref_type == 'tag' && needs.preflight.outputs.version || '' }}
      - uses: LibreSCRS/ci/actions/pkg-verify@164794a2151a30d5772355b7498acc2d73a2f7fa
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report
          hook: packaging/ci/verify-installed.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ steps.build.outputs.dist }}
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, source-tarball, packages]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts

      # Every package name already carries its slug, and the collector refused
      # a collision, so merging the per-slug sets cannot overwrite a file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'packages-*'
          merge-multiple: true
          path: artifacts

      - name: Check out the shared release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 164794a2151a30d5772355b7498acc2d73a2f7fa
          # A subdirectory: artifacts/ already holds the downloaded set, and
          # a checkout into the workspace root would wipe it.
          path: .ci
          persist-credentials: false

      - uses: LibreSCRS/ci/actions/release-seal@164794a2151a30d5772355b7498acc2d73a2f7fa
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-publish@164794a2151a30d5772355b7498acc2d73a2f7fa
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
