name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        run: |
          find src test plugins -name "*.cpp" -o -name "*.h" \
            | xargs clang-format-21 --dry-run --Werror

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Configure (Release)
        # Release matches what users receive — same `-O2 -DNDEBUG` code
        # path runs in production. Debug coverage lives in the developer
        # workflow; the CI gate exists to catch regressions in the
        # shipped configuration. LM is built transitively via FetchContent
        # in Release too, giving consumer-side Release cross-check of the
        # LM 4.0 surface.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --test-dir build/test

      - name: Test (LibreMiddleware)
        run: ctest --output-on-failure --test-dir build/_deps/libremiddleware-build/test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install ninja

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtpdf'
          cache: true

      - name: Configure (Release)
        # Both Linux and macOS CI build Release — matches what users
        # receive. Debug coverage lives in the developer workflow.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --test-dir build/test

      - name: Test (LibreMiddleware)
        run: ctest --output-on-failure --test-dir build/_deps/libremiddleware-build/test
