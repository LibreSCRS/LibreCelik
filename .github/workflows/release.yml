# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# preflight -> build-* -> seal -> publish. A tag push publishes. A dispatch,
# and a branch push that changes what the release builds, rehearse: the same
# jobs over the same code, with an ephemeral signing key instead of a keyless
# one, and the release kept as a workflow artefact instead of created. This is
# the only path to the AppImage, the DMG and the distribution packages, so a
# change to any of them is proved the way the tag will build it. Nothing is
# built or signed before the preflight has judged the tag's signature, the
# version surfaces and the cross-repository pins.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    branches: [main, 'ci/**']
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'packaging/**'
      - 'licenses/**'
      - 'scripts/linux/**'
      - 'scripts/macos/**'
      - 'ci/pins/**'
      - 'ci/release-assets.txt'
      - 'ci/scripts/check-bundled-licenses.py'
      - 'ci/scripts/gen-third-party-notices.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          # A tag push publishes; a branch push and a dispatch default to
          # rehearse (a dispatch may ask for publish, refused off a tag).
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          version-min: '1'

  build-linux:
    needs: [preflight]
    timeout-minutes: 90
    # A fixed image: the AppImage's glibc floor is the build host's (2.39 on
    # Ubuntu 24.04), and a moving label would move it under a tag.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema patchelf

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Build JasPer and qtimageformats for JPEG2000 support
        run: |
          # JasPer is not in Ubuntu repos; build from source. Both sources are
          # fetched by the commit ci/pins/jpeg2000.txt names, and the fetched
          # HEAD is asserted rather than trusted: a pin that "applied" while the
          # tree stayed on another commit is the failure this replaces. A
          # shallow clone cannot check out an arbitrary commit, so the pinned
          # object is fetched directly.
          fetch_pinned() {  # fetch_pinned <name> <dir>
            local _n url sha ver got
            read -r _n url sha ver < <(grep "^$1 " ci/pins/jpeg2000.txt) || true
            [ -n "${sha:-}" ] || { echo "::error::no pin for $1 in ci/pins/jpeg2000.txt"; exit 1; }
            mkdir -p "$2" && git -C "$2" init -q .
            git -C "$2" remote add origin "$url"
            git -C "$2" fetch --depth 1 origin "$sha"
            git -C "$2" checkout --detach FETCH_HEAD
            got="$(git -C "$2" rev-parse HEAD)"
            [ "$got" = "$sha" ] || { echo "::error::$1 pin $sha but HEAD $got"; exit 1; }
          }
          fetch_pinned jasper /tmp/jasper
          cmake -B /tmp/jasper-build -S /tmp/jasper \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DJAS_ENABLE_PROGRAMS=OFF -DJAS_ENABLE_DOC=OFF -G Ninja
          cmake --build /tmp/jasper-build
          sudo cmake --install /tmp/jasper-build
          sudo ldconfig

          # Build qtimageformats against aqtinstall Qt + JasPer
          QT_DIR="$(qmake6 -query QT_INSTALL_PREFIX)"
          # One fetch and no fallback. The branch-name clone used to retry with
          # a "v" prefix because Qt names its tags that way; a pin is a commit,
          # so the prefix question no longer exists, and neither does the
          # second clone that answered it.
          fetch_pinned qtimageformats /tmp/qtimageformats
          # The pin names a Qt release and the Qt step installs one exact
          # version: moving one without the other builds a plugin from one Qt's
          # sources into another Qt. Refuse it.
          qt_ver="$(qmake6 -query QT_VERSION)"
          read -r _ _ _ pin_ver < <(grep '^qtimageformats ' ci/pins/jpeg2000.txt) || true
          [ "$qt_ver" = "${pin_ver:-}" ] || { echo "::error::Qt $qt_ver is installed but qtimageformats is pinned to ${pin_ver:-nothing} -- move the pin with Qt"; exit 1; }
          # The bill of materials may name these commits only because they were
          # asserted above; a local build that did not fetch them passes no pins.
          echo "JPEG2000_PINS=$PWD/ci/pins/jpeg2000.txt" >> "$GITHUB_ENV"
          # Verify JasPer is findable
          echo "JasPer installed files:"
          ls /usr/local/lib/libjasper* /usr/local/include/jasper/jasper.h 2>/dev/null || echo "WARNING: JasPer not found in /usr/local"

          # Patch FindWrapJasper.cmake in BOTH source tree and Qt install
          JASPER_FIND='if(TARGET WrapJasper::WrapJasper)\n  set(WrapJasper_FOUND TRUE)\n  return()\nendif()\nadd_library(WrapJasper::WrapJasper INTERFACE IMPORTED)\ntarget_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)\ntarget_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)\nset(WrapJasper_FOUND TRUE)'
          printf "$JASPER_FIND\n" > /tmp/qtimageformats/cmake/FindWrapJasper.cmake
          printf "$JASPER_FIND\n" > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Patched FindWrapJasper.cmake in source and Qt install"

          cmake -B /tmp/qtimageformats-build -S /tmp/qtimageformats \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build /tmp/qtimageformats-build
          cmake --install /tmp/qtimageformats-build --prefix "$QT_DIR"
          # Re-patch FindWrapJasper (cmake --install overwrites it)
          printf '%s\n' \
            'if(TARGET WrapJasper::WrapJasper)' \
            '  set(WrapJasper_FOUND TRUE)' \
            '  return()' \
            'endif()' \
            'add_library(WrapJasper::WrapJasper INTERFACE IMPORTED)' \
            'target_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)' \
            'target_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)' \
            'set(WrapJasper_FOUND TRUE)' \
            > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Installed imageformat plugins:"
          ls "$QT_DIR/plugins/imageformats/"
          # Verify JP2 plugin was built
          if [[ ! -f "$QT_DIR/plugins/imageformats/libqjp2.so" ]]; then
            echo "::error::libqjp2.so was NOT built — check config.summary:"
            cat /tmp/qtimageformats-build/config.summary
            exit 1
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

      - name: The AppImage tools the shared lock names
        id: tools
        uses: LibreSCRS/ci/actions/appimage-tools@ac199ae69bc187a8571c9f29763503c1a966ea2c

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGE_TOOLS_LOCK: ${{ steps.tools.outputs.lock }}
          APPIMAGE_TOOLS_DIR: ${{ steps.tools.outputs.dir }}
        run: scripts/linux/build-appimage.sh build

      - name: The AppImage starts where there is no display
        # Its own runtime, its own bundled Qt and libraries, and no screen:
        # --version answers before the application needs one.
        run: |
          set -euo pipefail
          app="$(ls LibreCelik-*-x86_64.AppImage)"
          ver="${app#LibreCelik-}"; ver="${ver%-x86_64.AppImage}"
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY "./$app" --appimage-extract-and-run --version)"
          echo "$out"
          case "$out" in
            "LibreCelik $ver"*) ;;
            *) echo "::error::$app --version answered '$out', expected LibreCelik $ver"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-artifacts
          # if-no-files-found is evaluated over the AGGREGATE match set, not
          # per pattern: if the AppImage matches and the bill does not, this
          # step still succeeds. So it is a floor, not the net -- the net is
          # LibreSCRS/ci's check-sbom in the seal job, which reads the
          # documents that actually arrived.
          if-no-files-found: error
          retention-days: 3
          path: |
            LibreCelik-*.AppImage
            sbom-linux.cdx.json

  build-macos:
    needs: [preflight]
    timeout-minutes: 75
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        # Ninja only. The agent client library is plain CMake.
        run: brew install ninja

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtimageformats qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; install jsonschema
        # AFTER Qt setup so it lands in the python3 that cmake will
        # invoke for manifest2header.py codegen.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

      - name: Build DMG
        run: scripts/macos/build-dmg.sh build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-artifacts
          # See the linux-artifacts step: a floor over the aggregate match
          # set, not a per-pattern guarantee.
          if-no-files-found: error
          retention-days: 3
          path: |
            LibreCelik-*.dmg
            sbom-macos.cdx.json

  source-tarball:
    # The source tarball is produced by this project, not by GitHub. GitHub's
    # archive/refs/tags tarball omits every submodule tree and its bytes are
    # not ours to assert; this one comes from a clone with --recurse-submodules
    # and is byte-identical run to run. It is published for what it is on its
    # own: the exact sources beside the binaries built from them, signed and
    # listed in SHA256SUMS like every other asset.
    needs: [preflight]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: ac199ae69bc187a8571c9f29763503c1a966ea2c
          path: .ci
          persist-credentials: false

      - name: Build the source tarball
        run: |
          set -euo pipefail
          .ci/scripts/make-source-tarball --name librecelik --out "$RUNNER_TEMP/srctar"
          ls -l "$RUNNER_TEMP/srctar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Ends in -artifacts: the seal job collects `*-artifacts`.
          name: source-tarball-artifacts
          path: ${{ runner.temp }}/srctar/*.orig.tar.gz
          if-no-files-found: error
          retention-days: 3

  packages:
    # librecelik as a deb and an rpm for every supported distribution. On a
    # tag the agent client and the middleware come from their own published
    # releases of the same version (the release order publishes them first);
    # a rehearsal builds them from the commits deps.lock closes over instead.
    name: packages (${{ matrix.slug }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: LibreSCRS/ci/actions/pkg-build@ac199ae69bc187a8571c9f29763503c1a966ea2c
        id: build
        with:
          slug: ${{ matrix.slug }}
          upstream: ${{ github.ref_type == 'tag' && 'release' || 'source' }}
          version: ${{ github.ref_type == 'tag' && needs.preflight.outputs.version || '' }}
      - uses: LibreSCRS/ci/actions/pkg-verify@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report
          hook: packaging/ci/verify-installed.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ steps.build.outputs.dist }}
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, build-linux, build-macos, source-tarball, packages]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts

      # Every package name already carries its slug, and the collector refused
      # a collision, so merging the per-slug sets cannot overwrite a file.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'packages-*'
          merge-multiple: true
          path: artifacts

      - name: Check out the shared release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: ac199ae69bc187a8571c9f29763503c1a966ea2c
          # A subdirectory: artifacts/ already holds the downloaded set, and
          # a checkout into the workspace root would wipe it.
          path: .ci
          persist-credentials: false

      - name: Refuse a release whose bill of materials is missing or empty
        # Before anything is signed, deliberately: a signature over a document
        # this job is about to reject is worth not creating. Both bills sit in
        # one directory only here, so the pair is judged here, in one command:
        # a healthy Linux bill must not launder an empty macOS one. A signed
        # empty bill tells whoever triages a Qt or OpenSSL advisory, over this
        # project's signature, that the bundle carries no third-party code.
        run: |
          set -euo pipefail
          .ci/scripts/check-sbom \
            artifacts/sbom-linux.cdx.json \
            artifacts/sbom-macos.cdx.json

      - uses: LibreSCRS/ci/actions/release-seal@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-publish@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
