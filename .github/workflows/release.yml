# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Rehearsal path. A maintainer can start this workflow from the Actions
  # tab against an existing signed tag (Run workflow -> pick the tag as the
  # ref) to exercise the whole chain, release notes included, without
  # pushing a fresh tag. github.ref_name is the tag name on that path too,
  # so every step below behaves exactly as it does on a tag push — except
  # publication: a rehearsal creates a DRAFT unless the maintainer
  # explicitly flips dry_run off, so rehearsing can never overwrite or
  # duplicate a live release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Create the release as a draft (rehearsal)'
        type: boolean
        default: true

jobs:
  verify-signature:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # The release key's PRIMARY fingerprint, named once so the import check
      # and the signature check cannot pin different keys across a rotation.
      EXPECTED_FPR: '6B05889AC9A6A7188DF639B06F27A989C2031D16'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Import LibreSCRS release public key
        run: |
          # The published project key travels with the repository. Report its
          # absence in terms of what to do about it rather than letting gpg
          # fail with a bare open error.
          if [ ! -f KEYS ]; then
            echo "::error::KEYS is missing from the repository root — a release tag cannot be verified without the published LibreSCRS release public key"
            exit 1
          fi
          gpg --import KEYS
          gpg --list-keys --with-colons "$EXPECTED_FPR" | grep -q "^pub" \
            || { echo "::error::Public key import failed or fingerprint mismatch"; exit 1; }

      - name: Verify tag signature
        # verify-tag alone accepts a good signature by ANY key in the keyring,
        # so the signer is pinned by fingerprint through --raw's VALIDSIG line.
        #
        # Field order is the whole trick here. VALIDSIG's FIRST field is the
        # fingerprint of the key that physically signed, and this project signs
        # with a subkey (the primary is certify-only, `cSC`), so the first field
        # is the SUBKEY. The primary — the identity worth pinning, because it
        # outlives every subkey rotation — is VALIDSIG's LAST field. Matching
        # the primary right after "VALIDSIG" therefore rejects every genuinely
        # signed tag, and pinning the subkey instead would break at the next
        # rotation; match the primary in the trailing position.
        #
        # Anchored, and deliberately not a bare fingerprint grep: gpg also
        # emits KEY_CONSIDERED with the primary's fingerprint, and it does so
        # even for a BADSIG, so a loose match would accept a forged tag.
        #
        # The ref name moves through the environment, never inline into the
        # script — a git ref may carry shell metacharacters and the tag
        # filter's trailing * accepts an arbitrary suffix.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git verify-tag --raw "$TAG" 2>&1 \
            | grep -qE "^\[GNUPG:\] VALIDSIG [0-9A-F]{40} .* ${EXPECTED_FPR}\$" \
            || { echo "::error::Tag $TAG is not signed by the LibreSCRS release key"; exit 1; }

  build-linux:
    timeout-minutes: 90
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema patchelf

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Build JasPer and qtimageformats for JPEG2000 support
        run: |
          # JasPer is not in Ubuntu repos; build from source
          git clone --depth 1 https://github.com/jasper-software/jasper.git /tmp/jasper
          cmake -B /tmp/jasper-build -S /tmp/jasper \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DJAS_ENABLE_PROGRAMS=OFF -DJAS_ENABLE_DOC=OFF -G Ninja
          cmake --build /tmp/jasper-build
          sudo cmake --install /tmp/jasper-build
          sudo ldconfig

          # Build qtimageformats against aqtinstall Qt + JasPer
          QT_DIR="$(qmake6 -query QT_INSTALL_PREFIX)"
          git clone --depth 1 --branch "$(qmake6 -query QT_VERSION)" \
            https://code.qt.io/qt/qtimageformats.git /tmp/qtimageformats || \
          git clone --depth 1 --branch "v$(qmake6 -query QT_VERSION)" \
            https://code.qt.io/qt/qtimageformats.git /tmp/qtimageformats
          # Verify JasPer is findable
          echo "JasPer installed files:"
          ls /usr/local/lib/libjasper* /usr/local/include/jasper/jasper.h 2>/dev/null || echo "WARNING: JasPer not found in /usr/local"

          # Patch FindWrapJasper.cmake in BOTH source tree and Qt install
          JASPER_FIND='if(TARGET WrapJasper::WrapJasper)\n  set(WrapJasper_FOUND TRUE)\n  return()\nendif()\nadd_library(WrapJasper::WrapJasper INTERFACE IMPORTED)\ntarget_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)\ntarget_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)\nset(WrapJasper_FOUND TRUE)'
          printf "$JASPER_FIND\n" > /tmp/qtimageformats/cmake/FindWrapJasper.cmake
          printf "$JASPER_FIND\n" > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Patched FindWrapJasper.cmake in source and Qt install"

          cmake -B /tmp/qtimageformats-build -S /tmp/qtimageformats \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build /tmp/qtimageformats-build
          cmake --install /tmp/qtimageformats-build --prefix "$QT_DIR"
          # Re-patch FindWrapJasper (cmake --install overwrites it)
          printf '%s\n' \
            'if(TARGET WrapJasper::WrapJasper)' \
            '  set(WrapJasper_FOUND TRUE)' \
            '  return()' \
            'endif()' \
            'add_library(WrapJasper::WrapJasper INTERFACE IMPORTED)' \
            'target_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)' \
            'target_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)' \
            'set(WrapJasper_FOUND TRUE)' \
            > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Installed imageformat plugins:"
          ls "$QT_DIR/plugins/imageformats/"
          # Verify JP2 plugin was built
          if [[ ! -f "$QT_DIR/plugins/imageformats/libqjp2.so" ]]; then
            echo "::error::libqjp2.so was NOT built — check config.summary:"
            cat /tmp/qtimageformats-build/config.summary
            exit 1
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

      # DSS Java backend removed — native signing does not require Java.

      - name: Cache linuxdeploy tools
        uses: actions/cache@v4
        with:
          path: scripts/linux/tools
          key: linuxdeploy-continuous-v1

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/linux/build-appimage.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: LibreCelik-*.AppImage

  build-macos:
    timeout-minutes: 75
    needs: verify-signature
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        # Ninja only. The autoconf/automake/libtool/pkg-config chain that
        # used to live here existed solely for a transitively built
        # vendored autoconf bootstrap that this repo no longer pulls in;
        # the agent client library is plain CMake.
        run: brew install ninja

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtimageformats qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; install jsonschema
        # AFTER Qt setup so it lands in the python3 that cmake will
        # invoke for manifest2header.py codegen.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

      # DSS Java backend removed — native signing does not require Java.

      - name: Build DMG
        run: scripts/macos/build-dmg.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: LibreCelik-*.dmg

  release:
    timeout-minutes: 20
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign artifacts with cosign (keyless via Sigstore OIDC)
        run: |
          find artifacts -type f \
            ! -name '*.sigstore.json' \
            -exec sh -c 'cosign sign-blob "$1" --bundle "$1.sigstore.json" --yes' _ {} \;

      - name: Check out CHANGELOG
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            CHANGELOG.md
            VERSION
            ci/scripts/check-release-lockstep.sh
            cmake/libreagent.pin
          sparse-checkout-cone-mode: false
          # Check out into a SUBDIR. The root workspace already holds the
          # downloaded and cosigned artifacts/, and actions/checkout wipes
          # its target directory whenever there is no pre-existing .git
          # there (clean: false does NOT suppress that path). Isolating the
          # checkout in _changelog/ leaves artifacts/ untouched.
          path: _changelog

      - name: Enforce the release lockstep on a final tag
        # A final X.Y.Z tag must find the repository already speaking its
        # version: a CHANGELOG section for it (or the release ships generic
        # auto-notes) and a VERSION file equal to it (or every no-git source
        # drop stamps the previous release). Both are silent otherwise —
        # this is the step that makes them loud. Pre-release tags
        # (-rc/-beta/…) are exempt: they publish as drafts of the coming
        # version and legitimately ride on --generate-notes.
        #
        # ONE predicate decides both the exemption here and how the release is
        # published later, and it is exported so the two cannot drift apart.
        # They were separate tests — this step exempted anything containing a
        # character that is not a digit or a dot, while the publishing step
        # marked a pre-release only on an -rc/-beta/-alpha/-pre suffix. The push
        # filter accepts an arbitrary suffix, so every tag satisfying one test
        # and not the other (5.0.0-final, 5.0.0a, 5.0.0.hotfix) skipped the
        # lockstep entirely AND published as a stable release: exactly the two
        # silences this gate exists to end.
        #
        # Whether a tag is a pre-release is a property of the TAG, so it stays
        # here; the agreement itself is the same check the cheap lint job runs
        # on every push, so it lives in one script both callers share.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in
            *-rc*|*-beta*|*-alpha*|*-pre*) IS_PRERELEASE=true ;;
            *) IS_PRERELEASE=false ;;
          esac
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "pre-release tag $VER — lockstep gate not applied"
            exit 0
          fi
          export CHANGELOG_FILE=_changelog/CHANGELOG.md
          export VERSION_FILE=_changelog/VERSION
          _changelog/ci/scripts/check-release-lockstep.sh "$VER"

      - name: The agent pin is the agent's tag
        # The consumers pin the agent by commit so a build cannot drift onto
        # whatever the agent's branch holds that hour. At release time that pin
        # must be the commit the agent's own tag of the SAME version points at,
        # or this component ships built against something the agent never
        # published.
        #
        # The lookup dereferences. For an annotated tag the ref endpoint returns
        # the SHA of the TAG OBJECT, not of the commit, so comparing the two
        # directly would fail on every correctly signed tag — the same class of
        # mistake as reading VALIDSIG's fields in the wrong order.
        env:
          VER: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release job checks the sources out into _changelog/ so that
          # the downloaded and cosigned artifacts/ tree is left alone.
          pin=$(tr -d '[:space:]' < _changelog/cmake/libreagent.pin)
          tagsha=$(gh api repos/LibreSCRS/LibreAgent/git/ref/tags/"$VER" --jq '.object.sha')
          type=$(gh api repos/LibreSCRS/LibreAgent/git/ref/tags/"$VER" --jq '.object.type')
          if [ "$type" = "tag" ]; then
            tagsha=$(gh api repos/LibreSCRS/LibreAgent/git/tags/"$tagsha" --jq '.object.sha')
          fi
          [ "$pin" = "$tagsha" ] || {
            echo "::error::agent pin is not the agent's $VER tag (pin $pin, tag $tagsha)"
            exit 1
          }

      - name: Prepare release notes from CHANGELOG
        # One extractor, in ci/scripts/check-release-lockstep.sh, shared with
        # the per-push agreement check. It used to be copied inline into every
        # release workflow, and one of the copies had drifted: without escaping
        # the version's dots, tag 5.0.0 also matched a [500.0] heading.
        #
        # --section exits non-zero when the section is missing OR holds only
        # whitespace. Both have to fall back: `gh release create --notes-file`
        # accepts a blank file and publishes a release with no body at all.
        # --generate-notes and --notes-file are mutually exclusive, hence the
        # shell branch.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          export CHANGELOG_FILE=_changelog/CHANGELOG.md
          if _changelog/ci/scripts/check-release-lockstep.sh --section "$VER" > "$RUNNER_TEMP/relnotes.md"; then
            echo "NOTES_ARG=--notes-file $RUNNER_TEMP/relnotes.md" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG section for $VER — falling back to --generate-notes"
            echo "NOTES_ARG=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub release with all signed artefacts
        # Replaces softprops/action-gh-release@v2, which races between
        # asset upload and metadata update: releases carrying several
        # artefacts fail at "error updating release asset metadata:
        # HttpError: Not Found" even though every upload line reports
        # success. `gh release create` publishes the assets in one
        # deterministic request and exits.
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Mark X.Y.Z-{rc,beta,alpha,…} as a pre-release; everything else is a
          # stable release. The verdict is the one the lockstep step computed
          # and exported, so a tag can never be exempt from the gate here and
          # stable there.
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
          fi
          # A dispatch rehearsal publishes a DRAFT unless dry_run was
          # explicitly turned off; a tag push never drafts.
          DRAFT_FLAG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "false" ]; then
              DRAFT_FLAG="--draft"
              echo "::notice::dry_run rehearsal — creating a draft release"
          fi
          # --repo lets `gh` skip the .git autodetection: this job downloads
          # artefacts and sparse-checks-out the CHANGELOG into a subdir, so
          # the workspace root has no .git of its own. --verify-tag refuses
          # to invent a tag if this ever runs against a ref that is not one.
          # NOTES_ARG has to split into two argv entries and PRERELEASE_FLAG
          # has to disappear when empty, so both stay deliberately unquoted:
          # quoting NOTES_ARG would hand gh "--notes-file /path" as a single
          # argument and every release would fail.
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              $NOTES_ARG \
              $PRERELEASE_FLAG \
              $DRAFT_FLAG \
              artifacts/*
