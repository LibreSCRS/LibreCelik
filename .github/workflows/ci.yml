# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

  # Manual runs. A branch that is not a pull request otherwise gets no run,
  # and a job that cannot be triggered is green by construction.
  workflow_dispatch:

# Every job names the permissions it needs; the workflow grants none.
permissions: {}

jobs:
  format-check:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 because the self-test runner picks its set with
      # `git ls-files`, and a shallow checkout is a known source of a
      # different set here than locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the shared scope check
        # reads too: a directory nobody formats cannot appear without one of
        # these two steps saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # A wedged job in this project once held a runner until it was cancelled by hand.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      # The gates this repository shares with the others -- formatter scope,
      # skip reasons, the workflows read as data, the declaration registry,
      # duplicate bodies, every self-test this repository ships, and the
      # locked upstream revisions -- as LibreSCRS/ci's profile for it lists.
      - name: Shared gates
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4

      # The release's own preflight, rehearsed on every push: the CHANGELOG,
      # VERSION, the version this tree stamps and every packaging surface agree
      # on the pending release, and the tag verifier still says no to a forged
      # tag. Proved weeks before the tag rather than first on a tag that
      # cannot be taken back.
      - name: The tree is releasable as the version it names
        uses: LibreSCRS/ci/actions/release-preflight@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          mode: rehearse
          version-min: '1'

      - name: Every network clone is pinned by commit
        # The JPEG2000 sources are fetched by commit in two workflows; a pin
        # applied to one and not the other builds a different AppImage in CI
        # than the one the release signs.
        run: ./ci/scripts/check-network-pins.sh

  i18n-audit:
    # Static retranslate audit (no build required). Runs the full
    # tools/i18n_audit.py over src+plugins, then runs its own pytest
    # self-test. Exit non-zero on any non-allowlisted finding (--strict).
    # JSON dump is uploaded as an artefact for PR review and historical
    # comparison. See tools/README-i18n-audit.md for the audit design.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --break-system-packages --user pytest

      - name: Run i18n audit self-test
        run: python3 -m pytest tools/test_i18n_audit.py -v

      - name: Run i18n audit (strict)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/i18n_audit.py --strict --json "$RUNNER_TEMP/i18n-audit.json"

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: i18n-audit-json
          path: ${{ runner.temp }}/i18n-audit.json

  license-tools:
    # Pytest coverage for the bundled-license tooling
    # (check-bundled-licenses.py + gen-third-party-notices.py): normalize,
    # framework enumeration, internal_sonames .dylib mirrors, --platform
    # filter (both directions, checker + generator + end-to-end main()).
    # Catches drift in the manifest schema or filter logic before the
    # release-only AppImage / DMG fail-closed check fires. The count is
    # deliberately not written here: it went stale the first time a case
    # was added, and pytest prints the real one on every run.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --break-system-packages --user pytest

      - name: Run license-tools tests
        run: python3 -m pytest ci/scripts/test_license_tools.py -v

  build-linux:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema

      # One exact Qt release in every workflow: a patch release on the day of a
      # tag must not build something the branch never did. Moved deliberately,
      # together with the qtimageformats row of ci/pins/jpeg2000.txt.
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; the apt-installed
        # python3-jsonschema package is invisible to it. Install
        # jsonschema again via pip targeting the post-Qt-setup
        # `python3` so manifest2header.py codegen succeeds.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure (Release, warnings as errors)
        # Release matches what users receive — same `-O2 -DNDEBUG` code
        # path runs in production. Debug coverage lives in the developer
        # workflow; the CI gate exists to catch regressions in the
        # shipped configuration. The agent client library is built
        # transitively via FetchContent at the LibreAgent commit deps.lock
        # names -- never a branch -- so this job also gives a consumer-side
        # Release cross-check of that exact client revision. Qt6 is the only
        # external toolchain the fetch needs.
        #
        # LIBRECELIK_WERROR covers the GUI, its printing library and the six
        # GUI plugins; the fetched client, googletest and this repo's own test
        # executables stay warning-only. Deliberately not set on the macOS job:
        # the clean state this rests on was measured with GCC, and AppleClang's
        # diagnostic set is a different one that has never been surveyed.
        # Build type and the option are pinned together here so a later edit
        # to one cannot quietly disarm the other.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DLIBRECELIK_WERROR=ON

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      # The discovered test set against ci/test-manifest.linux.txt, and the
      # agent tree this configure fetched against the deps.lock row -- the
      # property, not the revision the configure printed.
      - name: Shared gates after the build
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          phase: build
          build-dir: build
          leg: linux

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

  build-macos:
    timeout-minutes: 60
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        # Ninja only. The agent client library is plain CMake.
        run: brew install ninja

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; install jsonschema
        # AFTER Qt setup so it lands in the python3 that cmake will
        # invoke for manifest2header.py codegen.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure (Release)
        # Both Linux and macOS CI build Release — matches what users
        # receive. Debug coverage lives in the developer workflow.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

  changes:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # What decides what the AppImage bundles, and the licence and bill
          # tooling that walks it. Not the CI's own scripts or this workflow:
          # a change to a gate is proved by the gate job, and rebuilding an
          # AppImage for it paid for three quarters of this job's runs.
          filters: |
            packaging:
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - 'cmake/**'
              - 'deps.lock'
              - 'scripts/linux/**'
              - 'licenses/**'
              - 'ci/pins/**'
              - 'ci/scripts/check-bundled-licenses.py'
              - 'ci/scripts/gen-third-party-notices.py'
              - 'ci/scripts/check-sbom.py'
            packages:
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - 'cmake/**'
              - 'deps.lock'
              - 'packaging/**'
              - 'CHANGELOG.md'
              - 'VERSION'

  license-drift-guard:
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.packaging == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Path-filtered (packaging paths only, owner-chosen trigger). Builds the
    # AppImage, whose build-appimage.sh walks the assembled AppDir TWICE:
    # --check fails closed on any unmapped bundled library, and --sbom writes
    # the bill that ships beside the artefact. In this workflow it is the
    # only job where either walk meets a real AppDir, so short of a release
    # rehearsal it is where the bill is first seen to be non-empty;
    # release.yml runs the same script, and scripts/macos/build-dmg.sh beside
    # it. The line to look for in this log is
    #   sbom: N components from M bundled objects (K without a version)
    # and an N of zero aborts the build before appimagetool seals anything.
    # Steps mirror the release.yml build-linux job. Known limitation: a
    # packaging-path filter does not fire for toolchain drift.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema patchelf

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125  # v4.4.1
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Build JasPer and qtimageformats for JPEG2000 support
        run: |
          # JasPer is not in Ubuntu repos; build from source. Both sources are
          # fetched by the commit ci/pins/jpeg2000.txt names, and the fetched
          # HEAD is asserted rather than trusted: a pin that "applied" while the
          # tree stayed on another commit is the failure this replaces. A
          # shallow clone cannot check out an arbitrary commit, so the pinned
          # object is fetched directly.
          fetch_pinned() {  # fetch_pinned <name> <dir>
            local _n url sha ver got
            read -r _n url sha ver < <(grep "^$1 " ci/pins/jpeg2000.txt) || true
            [ -n "${sha:-}" ] || { echo "::error::no pin for $1 in ci/pins/jpeg2000.txt"; exit 1; }
            mkdir -p "$2" && git -C "$2" init -q .
            git -C "$2" remote add origin "$url"
            git -C "$2" fetch --depth 1 origin "$sha"
            git -C "$2" checkout --detach FETCH_HEAD
            got="$(git -C "$2" rev-parse HEAD)"
            [ "$got" = "$sha" ] || { echo "::error::$1 pin $sha but HEAD $got"; exit 1; }
          }
          fetch_pinned jasper /tmp/jasper
          cmake -B /tmp/jasper-build -S /tmp/jasper \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DJAS_ENABLE_PROGRAMS=OFF -DJAS_ENABLE_DOC=OFF -G Ninja
          cmake --build /tmp/jasper-build
          sudo cmake --install /tmp/jasper-build
          sudo ldconfig

          # Build qtimageformats against aqtinstall Qt + JasPer
          QT_DIR="$(qmake6 -query QT_INSTALL_PREFIX)"
          # One fetch and no fallback. The branch-name clone used to retry with
          # a "v" prefix because Qt names its tags that way; a pin is a commit,
          # so the prefix question no longer exists, and neither does the
          # second clone that answered it.
          fetch_pinned qtimageformats /tmp/qtimageformats
          # The pin names a Qt release and the Qt step installs one exact
          # version: moving one without the other builds a plugin from one Qt's
          # sources into another Qt. Refuse it.
          qt_ver="$(qmake6 -query QT_VERSION)"
          read -r _ _ _ pin_ver < <(grep '^qtimageformats ' ci/pins/jpeg2000.txt) || true
          [ "$qt_ver" = "${pin_ver:-}" ] || { echo "::error::Qt $qt_ver is installed but qtimageformats is pinned to ${pin_ver:-nothing} -- move the pin with Qt"; exit 1; }
          # The bill of materials may name these commits only because they were
          # asserted above; a local build that did not fetch them passes no pins.
          echo "JPEG2000_PINS=$PWD/ci/pins/jpeg2000.txt" >> "$GITHUB_ENV"
          # Verify JasPer is findable
          echo "JasPer installed files:"
          ls /usr/local/lib/libjasper* /usr/local/include/jasper/jasper.h 2>/dev/null || echo "WARNING: JasPer not found in /usr/local"

          # Patch FindWrapJasper.cmake in BOTH source tree and Qt install
          JASPER_FIND='if(TARGET WrapJasper::WrapJasper)\n  set(WrapJasper_FOUND TRUE)\n  return()\nendif()\nadd_library(WrapJasper::WrapJasper INTERFACE IMPORTED)\ntarget_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)\ntarget_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)\nset(WrapJasper_FOUND TRUE)'
          printf "$JASPER_FIND\n" > /tmp/qtimageformats/cmake/FindWrapJasper.cmake
          printf "$JASPER_FIND\n" > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Patched FindWrapJasper.cmake in source and Qt install"

          cmake -B /tmp/qtimageformats-build -S /tmp/qtimageformats \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build /tmp/qtimageformats-build
          cmake --install /tmp/qtimageformats-build --prefix "$QT_DIR"
          # Re-patch FindWrapJasper (cmake --install overwrites it)
          printf '%s\n' \
            'if(TARGET WrapJasper::WrapJasper)' \
            '  set(WrapJasper_FOUND TRUE)' \
            '  return()' \
            'endif()' \
            'add_library(WrapJasper::WrapJasper INTERFACE IMPORTED)' \
            'target_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)' \
            'target_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)' \
            'set(WrapJasper_FOUND TRUE)' \
            > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Installed imageformat plugins:"
          ls "$QT_DIR/plugins/imageformats/"
          # Verify JP2 plugin was built
          if [[ ! -f "$QT_DIR/plugins/imageformats/libqjp2.so" ]]; then
            echo "::error::libqjp2.so was NOT built — check config.summary:"
            cat /tmp/qtimageformats-build/config.summary
            exit 1
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      # No test run here: build-linux already runs the suites. This guard's
      # only job is to build the AppImage so the bundled-license check fires.

      - name: Cache linuxdeploy tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: scripts/linux/tools
          key: linuxdeploy-continuous-v1

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/linux/build-appimage.sh build

      - name: The bill that build produced is publishable
        # The step above aborts if the bill it derives is empty, so this is
        # not a second opinion on the content. It is an assertion that the
        # bill EXISTS: deleting the --sbom call from the packaging script is
        # invisible to every other check here -- the licence walk still names
        # the same program, the suite still passes, bash -n is still clean --
        # and the first thing to notice would be the release job, at a tag.
        # Judged by the same program the release job runs, so the two cannot
        # disagree about what publishable means.
        run: python3 ci/scripts/check-sbom.py sbom-linux.cdx.json

  packages:
    # The distribution packages, built and installed the way the release
    # builds them: the agent client and the middleware from the commits
    # deps.lock closes over, then this repository, each in the slug's own
    # container, then the whole stack installed in a clean one and judged.
    # Path-filtered to what decides the packages; one slug per package
    # manager here, the release and LibreSCRS/ci's stack chain build all five.
    name: packages (${{ matrix.slug }})
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-24.04
    # Measured: middleware 7-9 min, agent 7-9, this repository 3-4, per slug.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: LibreSCRS/ci/actions/pkg-build@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        id: build
        with:
          slug: ${{ matrix.slug }}
          upstream: source
      - uses: LibreSCRS/ci/actions/pkg-verify@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-report-${{ matrix.slug }}
          retention-days: 7
          path: |
            ${{ steps.build.outputs.art }}/log
            ${{ runner.temp }}/pkg-report
