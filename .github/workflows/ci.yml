# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Manual runs. Without this a job that is deliberately not part of every pull
  # request -- a coverage pass that takes an hour, say -- cannot be started at
  # all: a branch that is not a pull request gets no run, and a gate that cannot
  # be triggered is green by construction.
  workflow_dispatch:

jobs:
  format-check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the scope check below
        # reads too: a directory nobody formats cannot appear without one of
        # these two steps saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # One wedged job in this project cost most of a working afternoon.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      - name: Check every tracked source is reachable by the formatter
        run: ./ci/scripts/check-format-scope.sh

      - name: Check every skip carries a reason
        # A test that skips without saying why is indistinguishable from a test
        # that passed. Costs a second and builds nothing.
        run: ./ci/scripts/check-skip-reasons.sh

      - name: Changelog and version agree on the pending release
        # Run on every push with the version this tree is heading for, so the
        # agreement is proved weeks before the tag rather than first on a tag
        # that cannot be taken back. The release job calls the same script with
        # the tag's version.
        run: ci/scripts/check-release-lockstep.sh "$(head -n1 VERSION | tr -d '[:space:]')"

      - name: Every job carries a time bound
        # An unbounded job that hangs holds a runner for six hours and will
        # not serve its log until the run is cancelled, so the failing test
        # cannot even be named. This fails when a new job arrives without a
        # bound, which is the only moment the omission is cheap to fix.
        run: ci/scripts/check-job-timeouts.sh

      - name: Every shipped gate is wired into CI
        # A gate nobody runs is not a gate: dup-scan.py and canonical-types.py
        # shipped in five repositories for a whole release cycle and no
        # workflow ever named either.
        run: ci/scripts/check-gates-wired.sh

      - name: Gate-wiring check self-test
        run: ci/scripts/check-gates-wired.selftest.sh

      - name: Canonical declaration registry
        # Single-checkout subset of the workspace scan. The cross-repository
        # half -- duplicate bodies between two checkouts -- needs every tree
        # side by side, which no single repository's CI has; this half is the
        # part one repository can prove on its own.
        run: python3 tools/canonical-types.py --repo "$(basename "$PWD")"

      - name: Duplicate bodies (this checkout)
        run: python3 tools/dup-scan.py --repo "$(basename "$PWD")"

      - name: Every first-party version floor names the major in VERSION
        # The 4.x sweep before 5.0 searched for the token `4.2`; the floor that
        # mattered read `4.0`, in the only executable consumer the project
        # ships, and survived. This measures the property instead: every
        # first-party find_package/find_dependency floor must name the major
        # the VERSION file names. It reads VERSION and never `git describe`, so
        # it is decidable before a tag exists -- which is the whole window in
        # which the mistake is cheap. --min 1 is the vacuum guard: a scan that
        # matches nothing is unmeasured, not clean.
        run: ci/scripts/check-version-floors.sh --min 1

      - name: Prove the floor gate still fails when it should
        # Twenty cases, instant, no build. A gate nobody has seen fail is a
        # line in a workflow file.
        run: ./ci/scripts/check-version-floors.selftest.sh

      - name: The version this tree stamps names the major in VERSION
        # The floor gate reads VERSION and the sources, so it stays green
        # whatever the version derivation does, and a check that configures
        # with git switched off is measuring the one input under which a tag
        # cannot win. Between code freeze and the tag `git describe` still
        # answers with the PREVIOUS release, and a tree that lets it decide
        # installs a package whose major contradicts its own VERSION, changelog
        # and packaging. This configures the real CMakeLists against a stubbed
        # tag, in both directions, and creates no tag anywhere.
        run: ci/scripts/check-version-stamp.sh --verbose

      - name: Prove the stamp gate still fails when it should
        # Seven fixtures, no compiler, no build. Two of them are shapes that
        # have really been written: the tag deciding unconditionally, and git
        # being ignored altogether.
        run: ./ci/scripts/check-version-stamp.selftest.sh

      - name: Every uploaded artefact has someone to download it
        # An artefact whose name no download step can match is built, kept for
        # ninety days and dropped from the release without a word: the release
        # simply carries one asset fewer. Names only -- whether the consumer is
        # ordered after the producer is the needs question, which this
        # repository answers only if it carries check-release-artifacts.sh.
        run: |
          ./ci/scripts/check-artifact-names.selftest.sh
          ./ci/scripts/check-artifact-names.sh

      - name: The source tarball is a function of the commit
        # This repository ships binaries and carries no packaging recipe of its
        # own, so nothing here holds the tarball's sha256 in a source= line.
        # The tarball is published beside the binaries and listed in the signed
        # SHA256SUMS instead, and anyone checking that manifest has to arrive
        # at the same bytes. Two runs, forced apart by a second boundary and a
        # umask boundary, then the property read out of the archive: every
        # member carries the commit's own timestamp, owner 0/0, a mode from the
        # set --mode writes, and a place in name order rather than in the order
        # readdir happened to return; nothing under .github/; and the top
        # directory a source build would cd into.
        run: |
          ./ci/scripts/check-tarball-determinism.selftest.sh
          ./ci/scripts/check-tarball-determinism.sh

  i18n-audit:
    # Static retranslate audit (no build required). Runs the full
    # tools/i18n_audit.py over src+plugins, then runs its own pytest
    # self-test. Exit non-zero on any non-allowlisted finding (--strict).
    # JSON dump is uploaded as an artefact for PR review and historical
    # comparison. See tools/README-i18n-audit.md for the audit design.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --break-system-packages --user pytest

      - name: Run i18n audit self-test
        run: python3 -m pytest tools/test_i18n_audit.py -v

      - name: Run i18n audit (strict)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/i18n_audit.py --strict --json /tmp/i18n-audit.json

      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit-json
          path: /tmp/i18n-audit.json

  license-tools:
    # Pytest coverage for the bundled-license tooling
    # (check-bundled-licenses.py + gen-third-party-notices.py): normalize,
    # framework enumeration, internal_sonames .dylib mirrors, --platform
    # filter (both directions, checker + generator + end-to-end main()).
    # Catches drift in the manifest schema or filter logic before the
    # release-only AppImage / DMG fail-closed check fires. The count is
    # deliberately not written here: it went stale the first time a case
    # was added, and pytest prints the real one on every run.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --break-system-packages --user pytest

      - name: Run license-tools tests
        run: python3 -m pytest ci/scripts/test_license_tools.py -v

  build-linux:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; the apt-installed
        # python3-jsonschema package is invisible to it. Install
        # jsonschema again via pip targeting the post-Qt-setup
        # `python3` so manifest2header.py codegen succeeds.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure (Release, warnings as errors)
        # Release matches what users receive — same `-O2 -DNDEBUG` code
        # path runs in production. Debug coverage lives in the developer
        # workflow; the CI gate exists to catch regressions in the
        # shipped configuration. The agent client library is built
        # transitively via FetchContent at the revision recorded in
        # cmake/libreagent.pin — a fixed commit SHA, never a branch — so
        # this job also gives a consumer-side Release cross-check of that
        # exact client revision. Qt6 is the only external toolchain the
        # fetch needs.
        #
        # LIBRECELIK_WERROR covers the GUI, its printing library and the six
        # GUI plugins; the fetched client, googletest and this repo's own test
        # executables stay warning-only. Deliberately not set on the macOS job:
        # the clean baseline this gate rests on was measured with GCC, and
        # AppleClang's diagnostic set is a different one that has never been
        # surveyed. Build type and the option are pinned together here so a
        # later edit to one cannot quietly disarm the other.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DLIBRECELIK_WERROR=ON

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # set -o pipefail is explicit: without it `| tee` reports tee's status
          # and a failed build becomes a green step, after which the warning
          # check measures a log that was never produced.
          set -o pipefail
          LC_ALL=C cmake --build build 2>&1 | tee build.log

      - name: The warning floor is still reachable
        # warning-gate.py judges the LOG, so a tree that has LOST compile units
        # makes it refuse every full build and blame the build. This judges the
        # configured graph instead, so the message names the stale number.
        run: ./ci/scripts/check-warning-floor.sh build

      - name: Warning-floor check self-test
        run: ./ci/scripts/check-warning-floor.selftest.sh

      - name: Check the warning baseline
        # Counted by the [-Wname] tag, never by the message text: diagnostics
        # are localised. An unknown compiler is reported, not failed -- this
        # runner and the machine that recorded the baseline do not agree on a
        # diagnostic set, and neither is authoritative over the other.
        run: ./ci/scripts/warning-gate.py --check build.log --build-dir build

      - name: Check the discovered test set
        run: ./ci/scripts/test-manifest-gate.sh --check build linux

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The pipe is removed rather than patched. The runner's default shell
          # for a `run:` step is `bash -e {0}` WITHOUT pipefail, so
          # `ctest ... | tee ctest.log` reports the status of tee: a failed
          # suite showed as a green step, and a check reading that log
          # afterwards passed too. With no pipe there is no question about what
          # the default is. Measured: the old shape exits 0 on a ctest that
          # fails, this one exits 1.
          set +e
          ctest --output-on-failure --no-tests=error --test-dir build > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check the skip ledger
        # always(): the ledger's whole point is the run where something did not
        # run, including runs where something also failed.
        if: always()
        run: ./ci/scripts/skip-ledger.sh --check ctest.log linux

  build-macos:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        # Ninja only. The autoconf/automake/libtool/pkg-config chain that
        # used to live here existed solely for a transitively built
        # vendored autoconf bootstrap that this repo no longer pulls in;
        # the agent client library is plain CMake.
        run: brew install ninja

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; install jsonschema
        # AFTER Qt setup so it lands in the python3 that cmake will
        # invoke for manifest2header.py codegen.
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Configure (Release)
        # Both Linux and macOS CI build Release — matches what users
        # receive. Debug coverage lives in the developer workflow.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test (LibreCelik)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error --test-dir build

  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packaging:
              - 'CMakeLists.txt'
              - '**/CMakeLists.txt'
              - 'cmake/**'
              - 'scripts/linux/**'
              - 'licenses/**'
              - '.github/workflows/ci.yml'

  license-drift-guard:
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    # Path-filtered (packaging paths only, owner-chosen trigger). Builds the
    # AppImage, whose build-appimage.sh runs check-bundled-licenses.py --check
    # and fails closed on any unmapped bundled library. Steps mirror the
    # release.yml build-linux job. Known limitation: a packaging-path filter
    # does not fire for toolchain / linuxdeploy / non-packaging drift.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema patchelf

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        run: python3 -m pip install --break-system-packages --user jsonschema

      - name: Build JasPer and qtimageformats for JPEG2000 support
        run: |
          # JasPer is not in Ubuntu repos; build from source
          git clone --depth 1 https://github.com/jasper-software/jasper.git /tmp/jasper
          cmake -B /tmp/jasper-build -S /tmp/jasper \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DJAS_ENABLE_PROGRAMS=OFF -DJAS_ENABLE_DOC=OFF -G Ninja
          cmake --build /tmp/jasper-build
          sudo cmake --install /tmp/jasper-build
          sudo ldconfig

          # Build qtimageformats against aqtinstall Qt + JasPer
          QT_DIR="$(qmake6 -query QT_INSTALL_PREFIX)"
          git clone --depth 1 --branch "$(qmake6 -query QT_VERSION)" \
            https://code.qt.io/qt/qtimageformats.git /tmp/qtimageformats || \
          git clone --depth 1 --branch "v$(qmake6 -query QT_VERSION)" \
            https://code.qt.io/qt/qtimageformats.git /tmp/qtimageformats
          # Verify JasPer is findable
          echo "JasPer installed files:"
          ls /usr/local/lib/libjasper* /usr/local/include/jasper/jasper.h 2>/dev/null || echo "WARNING: JasPer not found in /usr/local"

          # Patch FindWrapJasper.cmake in BOTH source tree and Qt install
          JASPER_FIND='if(TARGET WrapJasper::WrapJasper)\n  set(WrapJasper_FOUND TRUE)\n  return()\nendif()\nadd_library(WrapJasper::WrapJasper INTERFACE IMPORTED)\ntarget_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)\ntarget_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)\nset(WrapJasper_FOUND TRUE)'
          printf "$JASPER_FIND\n" > /tmp/qtimageformats/cmake/FindWrapJasper.cmake
          printf "$JASPER_FIND\n" > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Patched FindWrapJasper.cmake in source and Qt install"

          cmake -B /tmp/qtimageformats-build -S /tmp/qtimageformats \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build /tmp/qtimageformats-build
          cmake --install /tmp/qtimageformats-build --prefix "$QT_DIR"
          # Re-patch FindWrapJasper (cmake --install overwrites it)
          printf '%s\n' \
            'if(TARGET WrapJasper::WrapJasper)' \
            '  set(WrapJasper_FOUND TRUE)' \
            '  return()' \
            'endif()' \
            'add_library(WrapJasper::WrapJasper INTERFACE IMPORTED)' \
            'target_link_libraries(WrapJasper::WrapJasper INTERFACE /usr/local/lib/libjasper.so)' \
            'target_include_directories(WrapJasper::WrapJasper INTERFACE /usr/local/include)' \
            'set(WrapJasper_FOUND TRUE)' \
            > "$QT_DIR/lib/cmake/Qt6/FindWrapJasper.cmake"
          echo "Installed imageformat plugins:"
          ls "$QT_DIR/plugins/imageformats/"
          # Verify JP2 plugin was built
          if [[ ! -f "$QT_DIR/plugins/imageformats/libqjp2.so" ]]; then
            echo "::error::libqjp2.so was NOT built — check config.summary:"
            cat /tmp/qtimageformats-build/config.summary
            exit 1
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build

      # No test run here: build-linux already runs the suites. This guard's
      # only job is to build the AppImage so the bundled-license check fires.

      - name: Cache linuxdeploy tools
        uses: actions/cache@v4
        with:
          path: scripts/linux/tools
          key: linuxdeploy-continuous-v1

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/linux/build-appimage.sh build

  coverage:
    runs-on: ubuntu-latest
    # Not on pull_request: this pass costs an hour and the moment a
    # function actually lands is the push to main. Manual only until one
    # measured run says what it really costs on a hosted runner.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev uuid-dev libcurl4-openssl-dev libxml2-dev cmake ninja-build python3-jsonschema

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpdf'
          cache: true

      - name: Install jsonschema into Qt's Python
        # aqtinstall puts its own Python on PATH; the apt-installed
        # python3-jsonschema package is invisible to it. Install
        # jsonschema again via pip targeting the post-Qt-setup
        # `python3` so manifest2header.py codegen succeeds.
        run: python3 -m pip install --break-system-packages --user jsonschema


      - name: Install gcovr
        # Pinned: the baseline records the gcovr version it was measured with
        # and the gate refuses to compare across versions, because the exclude
        # semantics that decide the denominator have changed between them.
        run: python3 -m pip install --break-system-packages 'gcovr==8.6'

      - name: Configure (coverage)
        run: cmake --preset coverage

      - name: Build
        run: cmake --build build-cov -j4

      - name: Test
        run: |
          set +e
          ctest --output-on-failure --no-tests=error --test-dir build-cov > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      - name: Check coverage against the baseline
        # The committed baseline was measured with a different compiler than
        # this runner uses, so the FIRST authorised run of this job is expected
        # to refuse to compare and say so. Refusing is the design: a coverage
        # number carries the configuration it was measured under, and comparing
        # across configurations is how a gap becomes an artefact. Record a
        # runner-side baseline with --update, review it in the same commit, and
        # from then on this step is a ratchet.
        run: ./ci/scripts/coverage-gate.py --check build-cov

  package:
    # Distribution packages, built in the target distribution's own container.
    #
    # Containers rather than apt/dnf on the runner: ubuntu-latest is one
    # distribution in one version and cannot produce a trixie or an fc43
    # package, and a container makes the same build reproducible with one
    # `docker run` on a development machine.
    #
    # Images are pinned by digest, not by tag. A tag moves under you; a digest
    # does not.
    name: package (${{ matrix.slug }})
    if: vars.PACKAGE_JOB_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Measured locally at 45 minutes for the slowest image, times
    # about 2.5. A job with no limit does not fail when it hangs -- it burns
    # hours and hands back no log, because /logs answers 404 while it runs.
    timeout-minutes: 112
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: debian13
            image: debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
          - slug: ubuntu2604
            image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
          - slug: fedora43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out the working tree as the gate will read it
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Upstream packages come from their own published release. This job is
      # therefore enabled from the bottom up -- middleware first, then the
      # agent libraries, then the hosts -- because a job wired to a release
      # that does not exist yet is a job that has never run, and this project
      # has paid for one of those before. Set the repository variable
      # PACKAGE_JOB_ENABLED to true once the upstream release carries packages.
      - name: Fetch the upstream packages from their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.slug }}" in fedora43) fam=rpm ;; *) fam=deb ;; esac
          ver=$(tr -d '[:space:]' < VERSION)
          mkdir -p "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreMiddleware/$fam"
          gh release download "$ver" --repo LibreSCRS/LibreMiddleware \
            --pattern "*.$fam" \
            --dir "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreMiddleware/$fam"
          mkdir -p "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreAgent/$fam"
          gh release download "$ver" --repo LibreSCRS/LibreAgent \
            --pattern "*.$fam" \
            --dir "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreAgent/$fam"

      - name: Gate
        run: |
          # set +e first: the default shell here is `bash -eo pipefail`, so a
          # failing gate would end the step before its exit code could be read,
          # and the echo below would be dead text pretending to be a measurement.
          set +e
          bash packaging/ci/package-gate.sh "${{ matrix.image }}" "$RUNNER_TEMP/librescrs-packages/out"
          rc=$?
          set -e
          echo "PACKAGE_GATE_RC=$rc"
          test "$rc" = 0

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
